name: Belegung aktualisieren

on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden
  workflow_dispatch:         # auch von Hand startbar (Actions, Run workflow)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kalender holen und belegt.json schreiben
        env:
          ICAL_URL: ${{ secrets.AIRBNB_ICAL }}
        run: python3 .github/scripts/belegung.py
      - name: Speichern, falls geaendert
        run: |
          git config user.name "belegung-bot"
          git config user.email "actions@users.noreply.github.com"
          git add belegt.json
          if ! git diff --cached --quiet; then
            git commit -m "Belegung aktualisiert"
            git push
          else
            # Lebenszeichen: GitHub pausiert geplante Auftraege nach 60 Tagen ohne Aktivitaet.
            letzte=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - letzte )) -gt $(( 25 * 86400 )) ]; then
              git commit --allow-empty -m "Lebenszeichen (Belegung unveraendert)"
              git push
            fi
          fi
